name: バグ報告
description: バグの報告
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 問題の説明
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 再現手順
      placeholder: |
        1. ○○ を開く
        2. △△ をクリック
        3. エラーが発生する
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS バージョン
      placeholder: "例: macOS 14.5 Sonoma"
    validations:
      required: true
