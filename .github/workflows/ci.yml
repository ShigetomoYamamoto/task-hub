name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

  build:
    name: Build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Build
        run: |
          xcodebuild build \
            -scheme TaskHub \
            -destination "platform=macOS,arch=arm64" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty

  test:
    name: Test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Run Tests
        run: |
          xcodebuild test \
            -scheme TaskHub \
            -destination "platform=macOS,arch=arm64" \
            -configuration Debug \
            -enableCodeCoverage YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty
      - name: Check Coverage
        run: |
          # xccov でカバレッジを確認（80% 未満でフェイル）
          COVERAGE=$(xcrun xccov view --report --json DerivedData/Logs/Test/*.xcresult 2>/dev/null \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(int(d['lineCoverage']*100))" 2>/dev/null || echo "0")
          echo "カバレッジ: ${COVERAGE}%"
          if [ "$COVERAGE" -lt 80 ]; then
            echo "❌ カバレッジが 80% を下回っています（現在: ${COVERAGE}%）"
            exit 1
          fi

  custom-audit:
    name: Custom Audit
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Run Custom Audit
        run: bash .github/scripts/audit-custom.sh
